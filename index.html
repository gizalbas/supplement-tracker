<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual</title>

<style>
:root{
  --bg:#0b0908;
  --card:#17120e;
  --gold:#e7c78a;
  --gold2:#f3ddb0;
  --text:#fdf6ec;
  --muted:#b7a99a;
  --line:rgba(255,255,255,.1);
  --green:#8dbb8f;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top,#2a1d13,#0b0908 50%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.app{max-width:460px;margin:auto;padding:24px 16px 120px}

h1{
  font-family:Georgia,serif;
  font-size:42px;
}
h1 span{display:block;color:var(--gold)}

.card{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:26px;
  padding:18px;
  margin-top:14px;
}

.progress{
  width:90px;height:90px;
  border-radius:50%;
  background:conic-gradient(var(--gold) var(--p), rgba(255,255,255,.1) 0);
  display:flex;align-items:center;justify-content:center;
  margin:auto;margin-bottom:14px;
}
.progress div{
  width:70px;height:70px;border-radius:50%;
  background:#0b0908;display:flex;align-items:center;justify-content:center;
}

.item{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px;border:1px solid var(--line);
  border-radius:18px;margin-bottom:10px;
}
.item.done{background:rgba(141,187,143,.12)}

.check{
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--line);
}
.check.done{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#000}

.tabs{display:flex;gap:8px;margin-top:10px}
.tab{
  flex:1;text-align:center;padding:10px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted)
}
.tab.active{
  background:linear-gradient(160deg,var(--gold2),var(--gold));
  color:#000;border:none
}

.nav{
  position:fixed;bottom:10px;left:50%;
  transform:translateX(-50%);
  width:92%;display:flex;
  background:#0b0908;border:1px solid var(--line);
  border-radius:22px;padding:8px;
}
.nav button{flex:1;color:var(--muted)}
.nav button.active{color:var(--gold)}
</style>
</head>

<body>

<div class="app">

<h1>Supplement <span>Ritual</span></h1>

<div class="card">

<div class="progress" id="ring"><div id="percent">0%</div></div>

<h2 id="title">Day 1</h2>

<div class="tabs">
<button class="tab active" onclick="setView('daily',this)">Daily</button>
<button class="tab" onclick="setView('weekly',this)">Weekly</button>
</div>

<div id="list"></div>

<button onclick="nextDay()">Next Day</button>

</div>

</div>

<div class="nav">
<button onclick="setMode('onboarding',this)">Build</button>
<button onclick="setMode('weekly',this)">Weekly</button>
<button onclick="askNotif()">🔔</button>
<button onclick="resetAll()">Reset</button>
</div>

<script>

let day = Number(localStorage.getItem("day")||1);
let mode = localStorage.getItem("mode")||"onboarding";
let view = "daily";

const onboarding = [
"Vitamin C","D3","Omega 3","Ester-C","B12",
"Magnezyum","Probiyotik","CoQ10",
"Astaksantin","Resveratrol","Kolajen"
];

const weekly = [
"Omega 3","D3","Ester-C","B12",
"Magnezyum","Probiyotik","CoQ10"
];

function save(){
localStorage.setItem("day",day);
localStorage.setItem("mode",mode);
}

function setMode(m,btn){
mode=m;
save();
render();
}

function setView(v,btn){
view=v;
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");
render();
}

function toggle(name){
let d=JSON.parse(localStorage.getItem("data")||"{}");
d[name]=!d[name];
localStorage.setItem("data",JSON.stringify(d));
render();
}

function progress(arr){
let d=JSON.parse(localStorage.getItem("data")||"{}");
let done=arr.filter(x=>d[x]).length;
let pct=Math.round(done/arr.length*100)||0;
document.getElementById("ring").style.setProperty("--p",pct*3.6+"deg");
document.getElementById("percent").innerText=pct+"%";
}

function renderList(arr){
let d=JSON.parse(localStorage.getItem("data")||"{}");
return arr.map(n=>`
<div class="item ${d[n]?'done':''}">
${n}
<button class="check ${d[n]?'done':''}" onclick="toggle('${n}')">
${d[n]?'✓':''}
</button>
</div>
`).join("");
}

function render(){

let list=document.getElementById("list");

if(mode==="onboarding"){
document.getElementById("title").innerText="Day "+day;

let active=onboarding.slice(0,day);

list.innerHTML=renderList(active);
progress(active);

if(day>onboarding.length){
mode="weekly";
save();
render();
}

}else{

if(view==="daily"){
document.getElementById("title").innerText="Weekly Daily View";
list.innerHTML=renderList(weekly);
progress(weekly);
}else{
document.getElementById("title").innerText="Weekly Overview";

list.innerHTML = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
.map(d=>`<div class="item">${d}</div>`).join("");

document.getElementById("ring").style.setProperty("--p","0deg");
document.getElementById("percent").innerText="—";
}

}

}

function nextDay(){
day++;
save();
render();
}

function resetAll(){
localStorage.clear();
day=1;
mode="onboarding";
render();
}

function askNotif(){
Notification.requestPermission().then(p=>{
if(p==="granted"){
new Notification("Ritual",{
body:"Supplementlerini iç 💅"
});
}
});
}

render();

</script>

</body>
</html>
